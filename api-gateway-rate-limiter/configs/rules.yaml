global:
  capacity: 1000
  rate: 100.0
  window: 60s

endpoints:
  - path: "/api/v1/checkout"
    method: "POST"
    capacity: 20
    rate: 2.0
    window: 10s
  - path: "/api/v1/auth/*"
    method: "*"
    capacity: 50
    rate: 5.0
    window: 30s

clients:
  - id: "vip-partner"
    api_key: "vip-test-key-999"
    capacity: 10000
    rate: 1000.0
    window: 60s
    overrides:
      - path: "/api/v1/checkout"
        method: "POST"
        capacity: 500
        rate: 50.0
        window: 10s
  - id: "internal-service"
    ip_net: "10.99.0.0/16"
    capacity: 50000
    rate: 5000.0
    window: 60s
