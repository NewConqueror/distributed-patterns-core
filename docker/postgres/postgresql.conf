# --------------------------------------------------
# PostgreSQL 16 CDC & Logical Replication Ayarları
# --------------------------------------------------

# Bağlantı Ayarları
listen_addresses = '*'
port = 5432
max_connections = 100

# Bellek Ayarları
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 64MB

# --------------------------------------------------
# LOGICAL REPLICATION & CDC (Debezium Gereksinimleri)
# --------------------------------------------------

# wal_level: logical (Satır bazlı değişiklik detaylarını before/after WAL'a yazar)
wal_level = logical

# max_wal_senders: Replikasyon bağlantı thread havuzu limiti
max_wal_senders = 10

# max_replication_slots: Debezium ve replikasyon tüketicileri için yuva havuzu
max_replication_slots = 10

# commit timestamp izleme (CDC olaylarının commit zamanını yakalamak için faydalı)
track_commit_timestamp = on

# WAL segment boyutu ve checkpoint optimizasyonu
checkpoint_completion_target = 0.9
max_wal_size = 1GB
min_wal_size = 80MB
